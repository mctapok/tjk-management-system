spring:
  application:
    name: tjk-management-system
  datasource:
    url: jdbc:postgresql://localhost:5432/tjk_management_system_db
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway управляет схемой, Hibernate только валидирует
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:your-very-long-secret-key-change-in-production-min-256-bits}
    expiration-ms: 86400000      # 24 часа

logging:
  level:
    com.tracker: DEBUG
    org.springframework.security: INFO

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}

  jpa:
    show-sql: false

logging:
  level:
    com.tracker: INFO
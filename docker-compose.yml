version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tjk-management-system-db
    environment:
      POSTGRES_DB: tjk_management_system_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tjk_management_system_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: tjk-management-system-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tjk_management_system_db
      DB_USER: postgres
      DB_PASS: postgres
      JWT_SECRET: change-this-secret-in-production-256-bits-minimum
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data: